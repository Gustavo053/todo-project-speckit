<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="#{error.404.title}">Página não encontrada</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<main class="error-page">
    <h1 th:text="#{error.404.title}">Página não encontrada</h1>
    <p th:text="#{error.404.body}">Não encontramos o que você procurava.</p>
    <a class="button button--primary" th:href="@{/}" th:text="#{error.backToBoard}">Voltar ao quadro</a>
</main>
</body>
</html>
