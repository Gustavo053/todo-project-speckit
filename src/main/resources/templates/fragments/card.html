<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<article th:fragment="card(card)" class="card" th:id="${'card-' + card.id()}" tabindex="-1">
    <h3 class="card__title" th:text="${card.title()}">Título</h3>

    <p th:if="${card.hasNote()}" class="card__note" th:classappend="${card.noteHasMore()} ? 'card__note--clamped' : ''">
        <span th:text="${card.note()}">Anotação</span>
    </p>
    <p th:if="${card.hasNote() and card.noteHasMore()}" class="card__note-more">
        <a th:href="@{'/cards/' + ${card.id()} + '/edit'}" th:text="#{card.note.more}">ver tudo</a>
    </p>

    <form class="card__move" th:action="@{'/cards/' + ${card.id()} + '/move'}" method="post">
        <input type="hidden" name="revision" th:value="${card.revision()}"/>
        <fieldset class="card__move-fieldset">
            <legend class="sr-only" th:text="#{card.move.legend}">Mover para</legend>
            <button th:each="target : ${card.moveTargets()}"
                    type="submit" name="stage" th:value="${target}" class="card__move-button"
                    th:text="#{${'stage.' + target}}">
                Coluna
            </button>
        </fieldset>
    </form>

    <div class="card__actions">
        <a class="card__action" th:href="@{'/cards/' + ${card.id()} + '/edit'}"
           th:text="#{card.edit}" th:attr="aria-label=#{card.edit.aria(${card.title()})}">Editar</a>
        <a class="card__action card__action--danger" th:href="@{'/cards/' + ${card.id()} + '/delete'}"
           th:text="#{card.delete}" th:attr="aria-label=#{card.delete.aria(${card.title()})}">Excluir</a>
    </div>
</article>
</body>
</html>
